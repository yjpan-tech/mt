<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微波吸收最小反射損耗 (RLmin_dB) 預測系統</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary: #3498db;
            --primary-hover: #2980b9;
            --success: #2ecc71;
            --warning: #e67e22;
            --danger: #e74c3c;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 600px;
            padding: 35px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 24px;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .label-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        label {
            font-weight: 500;
            font-size: 15px;
        }

        .value-display {
            font-weight: bold;
            color: var(--primary);
            background: #eaf2f8;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .range-limits {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .result-card {
            background: var(--bg-color);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-top: 30px;
            border: 1px solid var(--border);
        }

        .result-label {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 42px;
            font-weight: 700;
            margin: 10px 0;
            transition: color 0.3s;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .status-good {
            background-color: #d4edda;
            color: #155724;
        }

        .status-normal {
            background-color: #fff3cd;
            color: #856404;
        }

        .gauge-container {
            width: 100%;
            background: #ddd;
            height: 10px;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
        }

        .gauge-bar {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: width 0.3s, background-color 0.3s;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MWCNT-微波吸收預測</h2>
    
    <div class="input-group">
        <div class="label-container">
            <label for="concentration">材料濃度 (Concentration, %)</label>
            <span id="con-val" class="value-display">2.50 %</span>
        </div>
        <input type="range" id="concentration" min="0.1" max="5.0" step="0.01" value="2.50">
        <div class="range-limits">
            <span>0.1%</span>
            <span>5.0%</span>
        </div>
    </div>

    <div class="input-group">
        <div class="label-container">
            <label for="thickness">樣品厚度 (Thickness, mm)</label>
            <span id="t-val" class="value-display">1.25 mm</span>
        </div>
        <input type="range" id="thickness" min="0.5" max="2.0" step="0.01" value="1.25">
        <div class="range-limits">
            <span>0.5 mm</span>
            <span>2.0 mm</span>
        </div>
    </div>

    <div class="result-card">
        <div class="result-label">預測最小反射損耗</div>
        <div id="result-db" class="result-value">-15.00 dB</div>
        <div id="status-badge" class="status-badge status-good">吸波性能良好 (RL &lt; -10 dB)</div>
        
        <div class="gauge-container">
            <div id="gauge-bar" class="gauge-bar"></div>
        </div>
    </div>
</div>

<script>
    const conSlider = document.getElementById('concentration');
    const tSlider = document.getElementById('thickness');
    const conVal = document.getElementById('con-val');
    const tVal = document.getElementById('t-val');
    const resultDb = document.getElementById('result-db');
    const statusBadge = document.getElementById('status-badge');
    const gaugeBar = document.getElementById('gauge-bar');

    function updatePrediction() {
        const c = parseFloat(conSlider.value);
        const t = parseFloat(tSlider.value);

        conVal.textContent = c.toFixed(2) + ' %';
        tVal.textContent = t.toFixed(2) + ' mm';

        let rl = -26.0411 
                 + 6.0913 * c 
                 + 65.5276 * t 
                 + 2.6529 * Math.pow(c, 2) 
                 - 16.5692 * c * t 
                 - 48.0864 * Math.pow(t, 2) 
                 - 0.4236 * Math.pow(c, 3) 
                 - 0.1945 * Math.pow(c, 2) * t 
                 + 6.0907 * c * Math.pow(t, 2) 
                 + 10.6218 * Math.pow(t, 3);

        if (rl > 0) rl = 0;
        if (rl < -60) rl = -60;

        resultDb.textContent = rl.toFixed(2) + ' dB';

        if (rl < -10) {
            statusBadge.textContent = "吸波性能良好 (RL < -10 dB)";
            statusBadge.className = "status-badge status-good";
            resultDb.style.color = "#2ecc71";
        } else {
            statusBadge.textContent = "吸波性能一般 (RL ≥ -10 dB)";
            statusBadge.className = "status-badge status-normal";
            resultDb.style.color = "#e67e22";
        }

        let percentage = Math.min(Math.max((rl / -50) * 100, 0), 100);
        gaugeBar.style.width = percentage + '%';
        gaugeBar.style.backgroundColor = rl < -10 ? '#2ecc71' : '#e67e22';
    }

    conSlider.addEventListener('input', updatePrediction);
    tSlider.addEventListener('input', updatePrediction);

    updatePrediction();
</script>

</body>
</html>
