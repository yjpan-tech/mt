        .subtitle { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }
        .input-group { margin-bottom: 25px; }
        .label-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        label { font-weight: 500; font-size: 15px; }
        .value-display { font-weight: bold; color: var(--primary); background: #ebf5fb; padding: 2px 10px; border-radius: 20px; font-size: 14px; }
        input[type="range"] { width: 100%; -webkit-appearance: none; height: 8px; border-radius: 5px; background: #ddd; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); cursor: pointer; transition: transform 0.1s; }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .range-limits { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .result-card { background: var(--bg-color); border-radius: 12px; padding: 25px; text-align: center; margin-top: 30px; border: 1px solid var(--border); }
        .result-label { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .result-value { font-size: 42px; font-weight: 700; margin: 10px 0; transition: color 0.3s; }
        .status-badge { display: inline-block; padding: 6px 16px; border-radius: 50px; font-size: 14px; font-weight: bold; margin-top: 10px; transition: all 0.3s; }
        .status-good { background-color: #d4edda; color: #155724; }
        .status-normal { background-color: #fff3cd; color: #856404; }
        .gauge-container { width: 100%; background: #ddd; height: 10px; border-radius: 5px; margin-top: 20px; overflow: hidden; }
        .gauge-bar { height: 100%; width: 0%; background: var(--primary); transition: width 0.1s, background-color 0.3s; }
        .engine-badge { display: inline-block; font-size: 11px; background: #e0e0e0; padding: 3px 8px; border-radius: 4px; margin-top: 15px; color: #555; transition: all 0.2s; }
        .badge-exact { background: #d1ecf1; color: #0c5460; font-weight: bold;}
    </style>
</head>

    const conSlider = document.getElementById('concentration');
    const tSlider = document.getElementById('thickness');
    const conVal = document.getElementById('con-val');
    const tVal = document.getElementById('t-val');
    const resultDb = document.getElementById('result-db');
    const statusBadge = document.getElementById('status-badge');
    const gaugeBar = document.getElementById('gauge-bar');
    const engineBadge = document.getElementById('engine-badge');

    function predictKNN(c, t) {
        // 步驟 A: 特徵標準化
        let scaled_c = (c - scaler.mean_c) / scaler.scale_c;
        let scaled_t = (t - scaler.mean_t) / scaler.scale_t;

        // 步驟 B: 計算與所有點的歐氏距離，同時檢查精確匹配
        let exactMatch = null;
        let distances = KNN_DATA.map(pt => {
            let dist = Math.sqrt(Math.pow(pt[0] - scaled_c, 2) + Math.pow(pt[1] - scaled_t, 2));
            if (dist < 0.0001 && !exactMatch) {
                exactMatch = pt[2]; // 找到距離極小的值，視為精確匹配
            }
            return { dist: dist, rl: pt[2] };
        });

        if (exactMatch !== null) {
            return { value: exactMatch, isExact: true };
        }

        // 步驟 C: 將距離由小到大排序
        distances.sort((a, b) => a.dist - b.dist);

        // 步驟 D: 選擇最近的 K 個點 (K=4)，並使用距離倒數作為權重 (weights='distance')
        let k = 4;
        let weightSum = 0;
        let valueSum = 0;

        for (let i = 0; i < k; i++) {
            // 防呆處理: 如果距離為0 (前面理論上已經被 exactMatch 抓走，多一層保險)
            if (distances[i].dist === 0) return { value: distances[i].rl, isExact: true };
            
            let w = 1.0 / distances[i].dist;
            weightSum += w;
            valueSum += w * distances[i].rl;
        }

        return { value: valueSum / weightSum, isExact: false };
    }

    function updatePrediction() {
        const c = parseFloat(conSlider.value);
        const t = parseFloat(tSlider.value);

        conVal.textContent = c.toFixed(2) + ' pct';
        tVal.textContent = t.toFixed(2) + ' mm';

        let result = predictKNN(c, t);
        let rl = result.value;

        // 數值界線防護 (根據資料特性設定合理範圍)
        if (rl > 0) rl = 0;
        if (rl < -50) rl = -50; 

        resultDb.textContent = rl.toFixed(2) + ' dB';

        // 根據微波吸收特性，-10 dB 代表 90% 的能量被吸收，是常用的及格標準
        if (rl <= -10) {
            statusBadge.textContent = "吸波性能良好 (RL ≤ -10 dB)";
            statusBadge.className = "status-badge status-good";
            resultDb.style.color = "#2ecc71";
        } else {
            statusBadge.textContent = "吸波性能一般 (RL > -10 dB)";
            statusBadge.className = "status-badge status-normal";
            resultDb.style.color = "#e67e22";
        }

        // 動態更新進度條 (假設 -20 dB 算滿分，以此抓比例)
        let percentage = Math.min(Math.max((rl / -20) * 100, 0), 100);
        gaugeBar.style.width = percentage + '%';
        gaugeBar.style.backgroundColor = rl <= -10 ? '#2ecc71' : '#e67e22';

        if (result.isExact) {
            engineBadge.textContent = "運算引擎: 實驗數據精確匹配 (Exact Match)";
            engineBadge.className = "engine-badge badge-exact";
        } else {
            engineBadge.textContent = "運算引擎: KNN 距離權重內插 (K=4)";
            engineBadge.className = "engine-badge";
        }
    }

    conSlider.addEventListener('input', updatePrediction);
    tSlider.addEventListener('input', updatePrediction);
    
    // 初始化執行一次
    updatePrediction();
